# ─────────────────────────────────────────────────────────────────────────────
# 인스타그램 자동 게시 (@titakorea)
#
# 화·목 11:00 KST에 assets/instagram/queue.txt의 첫 미게시 세트를 올린다(화=궁금해할 것, 목=갈 곳 — 주말 계획용).
# 세트에 story.jpg가 있으면 스토리도 같이 올린다.
# 수동으로는 Actions 탭 → Run workflow → slug 입력.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions)
#   IG_ACCESS_TOKEN   만료 없는 시스템유저 토큰(Unified 로그인) 권장.
#                     Instagram 로그인형 60일 토큰이면 만료 전에
#                     `node scripts/instagram/publish.mjs --refresh-token` 으로 갈아끼울 것.
#   IG_USER_ID        인스타 프로페셔널 계정 ID (`--whoami`)
# Variables (선택)
#   IG_GRAPH_HOST     graph.instagram.com(기본) / graph.facebook.com(시스템유저 토큰)
#
# 이미지는 raw.githubusercontent.com(main)에서 가져가므로 세트가 main에 있어야 한다.
# 게시 뒤 published.json을 [skip ci]로 커밋해 두 번 올라가지 않게 한다.
# ─────────────────────────────────────────────────────────────────────────────
name: Instagram publish

on:
  schedule:
    - cron: "0 2 * * 2,4"   # 화·목 11:00 KST
  workflow_dispatch:
    inputs:
      slug:
        description: "올릴 세트 폴더 (assets/instagram/<slug>). 비우면 큐의 다음 것"
        required: false
        type: string
      dry_run:
        description: "올리지 않고 내용만 확인"
        required: false
        type: boolean
        default: false
      story:
        description: "같은 폴더의 story.jpg도 스토리로 올림"
        required: false
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then ARGS="--slug ${{ inputs.slug }}"; else ARGS="--next --with-story"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/instagram/publish.mjs $ARGS
          if [ "${{ inputs.story }}" = "true" ] && [ -n "${{ inputs.slug }}" ]; then
            node scripts/instagram/publish.mjs --story ${{ inputs.slug }} $( [ "${{ inputs.dry_run }}" = "true" ] && echo --dry-run )
          fi

      - name: Commit ledger
        run: |
          if git diff --quiet -- assets/instagram/published.json; then exit 0; fi
          git config user.name "tita-bot"
          git config user.email "noreply@tita-app.com"
          git add assets/instagram/published.json
          git commit -m "chore(인스타): 게시 장부 갱신 [skip ci]"
          git push
