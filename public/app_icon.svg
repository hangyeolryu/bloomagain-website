<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 티타 brand icon — Monotone Forest palette.
       Solid deep forest background + bold white "티타" text centered.
       No transparency: iOS App Store rejects alpha on icon. -->
  <rect width="1024" height="1024" fill="#1F4E3D"/>

  <!-- "티타" centred. Korean Pretendard / system fallback chain.
       Font size tuned so two-character glyph block reads cleanly at
       60px home-screen size without losing legibility. -->
  <text
    x="512"
    y="512"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="420"
    font-weight="700"
    letter-spacing="-12"
    fill="#FBF7F0">티타</text>
</svg>
