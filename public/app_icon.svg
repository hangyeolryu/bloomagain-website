<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand-tinted twin of the iOS app icon — navy gradient (#10367D → #0A2459)
       matches the marketing palette. The original indigo variant (#4F46E5 →
       #3730A3) lives in bloomagain-korea/assets/app_icon.svg for the App Store
       binary; we don't touch that one. No transparency: alpha breaks favicons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10367D"/>
      <stop offset="1" stop-color="#0A2459"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

